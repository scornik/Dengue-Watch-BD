[project]
name = "denguewatch-satellite"
version = "0.1.0"
description = "DengueWatch BD: weekly ward environmental risk score from Sentinel-2, Landsat, Open-Meteo (M7)"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "xarray>=2024.6",
    "dask[array]>=2024.6",
    "odc-stac>=0.3.10",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "rasterio>=1.3.10",
    "rioxarray>=0.15",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::PendingDeprecationWarning:rioxarray.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
