[project]
name = "denguewatch-detector"
version = "0.1.0"
description = "DengueWatch BD: breeding-site photo classifier (dataset export, YOLO training, screening API) (P3)"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
# Heavy ML deps (ultralytics -> torch) live in requirements-train.txt so tests stay fast.
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pillow>=10.3",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
# Upstream notice about the TestClient backend; not actionable for us.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.security.HTTPBearer"]
